name: Backtest resolution agent

on:
  workflow_dispatch: {}   # manual trigger only — this is a diagnostic, not a scheduled job

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run 20 historical resolution cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/backtest-resolutions.mjs

      - name: Commit results
        run: |
          git config user.name "notcfo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest-results.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi
          git commit -m "Backtest: resolution agent vs 20 historical windows [manual]"
          for i in 1 2 3; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected — fetching and rebasing (attempt $i)..."
            git fetch origin
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict — needs manual resolution. Leaving as-is."
              git rebase --abort
              exit 1
            fi
          done
          echo "Still couldn't push after 3 attempts."
          exit 1
