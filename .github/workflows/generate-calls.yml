name: Generate standing calls

on:
  schedule:
    # 06:00 UTC daily — adjust freely. Each run costs ~28 API calls
    # (4 domains x 7 calls each: 1 search + 5 personas + 1 synthesis).
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate standing calls
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-calls.mjs

      - name: Commit if changed
        run: |
          git config user.name "notcfo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calls.json
          git diff --staged --quiet || git commit -m "Refresh standing calls [automated]"
          git push
