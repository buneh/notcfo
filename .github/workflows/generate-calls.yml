name: Generate + resolve standing calls

on:
  schedule:
    # 06:00 UTC daily. Sensing runs for all 5 domains every run so Signal
    # stays fresh, whether or not a call slot is open. A new call is
    # written only when a domain's slot is empty. resolve-calls.mjs only
    # researches calls past their horizon that do not already have a draft.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sense all domains, refresh Signal, fill any open call slots
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node scripts/swarm.mjs

      - name: Draft resolutions for calls past their horizon
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node scripts/resolve-calls.mjs

      - name: Commit if changed
        run: |
          git config user.name "notcfo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calls.json data/signal.json data/resolution-drafts.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi
          git commit -m "Standing calls: refresh Signal + fill slots + draft resolutions [automated]"
          for i in 1 2 3; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected — fetching and rebasing (attempt $i)..."
            git fetch origin
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict — needs manual resolution. Leaving as-is."
              git rebase --abort
              exit 1
            fi
          done
          echo "Still couldn't push after 3 attempts."
          exit 1
