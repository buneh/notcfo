name: Generate + resolve standing calls

on:
  schedule:
    # 06:00 UTC daily. generate-calls.mjs only spends API calls on empty
    # slots (a domain with an active call is skipped entirely), and
    # resolve-calls.mjs only researches calls past their horizon without
    # an existing draft — so most days this does very little.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fill any open standing-call slots
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-calls.mjs

      - name: Draft resolutions for calls past their horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/resolve-calls.mjs

      - name: Commit if changed
        run: |
          git config user.name "notcfo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calls.json data/resolution-drafts.json
          git diff --staged --quiet || git commit -m "Standing calls: fill slots + draft resolutions [automated]"
          git push
