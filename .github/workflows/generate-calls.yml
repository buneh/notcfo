name: Generate + resolve standing calls

on:
  schedule:
    # 06:00 UTC daily. Sensing now runs for all 5 domains every run (to
    # keep Signal fresh), regardless of whether a call slot is open —
    # that's a real, deliberate daily cost, not a bug. Call-generation
    # itself still only spends the (much larger) 50-persona council cost
    # on domains with an open slot. resolve-calls.mjs only researches
    # calls past their horizon without an existing draft.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Sense all domains, refresh Signal, fill any open call slots
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-calls.mjs

      - name: Draft resolutions for calls past their horizon
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/resolve-calls.mjs

      - name: Commit if changed
        run: |
          git config user.name "notcfo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calls.json data/signal.json data/resolution-drafts.json
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi
          git commit -m "Standing calls: refresh Signal + fill slots + draft resolutions [automated]"
          # A concurrent commit (e.g. from the Desk approving/declining a
          # draft) can land between checkout and push. Rebase once before
          # giving up — this handles the common case (an unrelated or
          # non-overlapping concurrent change) automatically, the same
          # fetch+rebase recovery used manually throughout this project.
          # A genuine same-line conflict still fails the job rather than
          # guessing at a resolution — but this run's real API spend is
          # at least not thrown away on every ordinary timing collision.
          for i in 1 2 3; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected — fetching and rebasing (attempt $i)..."
            git fetch origin
            if ! git rebase origin/main; then
              echo "Rebase hit a real conflict — needs manual resolution. Leaving as-is."
              git rebase --abort
              exit 1
            fi
          done
          echo "Still couldn't push after 3 attempts."
          exit 1
